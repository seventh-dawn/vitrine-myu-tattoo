<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stencil Vault</title>
  <meta name="description" content="Tagged Procreate stencil drafts, synced with Google Drive and packed for conventions.">
  <meta name="theme-color" content="#f5f0e7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stencil Vault">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gloock&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1 class="mark">Stencil <span>Vault</span></h1>
        <p class="count" id="count"></p>
      </div>
      <label class="search">
        <span class="search-ico"></span>
        <input id="q" type="search" placeholder="Search designs, tags, notes" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      </label>
      <button class="btn btn-ink" id="btn-add" type="button"></button>
      <button class="icon-btn" id="btn-account" type="button" aria-label="Account and storage"></button>
    </header>
    <div class="status" id="status" hidden></div>
    <nav class="tags" id="tags" aria-label="Filter by tag"></nav>
    <div class="packbar" id="packbar" hidden></div>
    <main class="grid" id="grid"></main>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Design details" inert>
    <div class="grabber" aria-hidden="true"></div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <section class="welcome" id="welcome" hidden></section>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
